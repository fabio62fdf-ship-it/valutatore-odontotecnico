<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Ruota della Fortuna - La Doppia Anima della Liguria</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel-bg: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
        h1 {
            margin-bottom: 5px;
            color: #38bdf8;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            text-align: center;
            font-size: 1.8rem;
        }
        p.subtitle {
            color: #94a3b8;
            margin-bottom: 15px;
            text-align: center;
            font-size: 0.95rem;
        }
        .scoreboard {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        .player-card {
            background: var(--panel-bg);
            padding: 10px 25px;
            border-radius: 12px;
            border: 2px solid #334155;
            text-align: center;
            min-width: 140px;
            transition: all 0.3s;
        }
        .player-card.active {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            transform: scale(1.05);
        }
        .player-card h3 {
            margin: 0 0 5px 0;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        .player-card .score {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffd700;
        }
        .main-container {
            display: flex;
            gap: 40px;
            align-items: center;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            flex-wrap: wrap;
            justify-content: center;
        }
        .wheel-container {
            position: relative;
            width: 420px;
            height: 420px;
        }
        canvas {
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
            background: #1e293b;
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 35px solid #ef4444;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.5));
            z-index: 10;
        }
        .panel {
            width: 400px;
            background: #0f172a;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #334155;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .turn-info {
            font-size: 1.1rem;
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }
        button.spin-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 15px;
        }
        button.spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .question-box {
            display: none;
            margin-top: 10px;
        }
        .question-text {
            font-size: 0.95rem;
            margin-bottom: 12px;
            line-height: 1.4;
            color: #f1f5f9;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .option-btn {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 8px;
            text-align: left;

            font-size: 0.85rem;
            transition: 0.2s;

        .option-btn:hover:not(:disabled) {

        }

        .winner-screen {
            display: none;
            text-align: center;
        }

        }

</head>

    ],

let availableQuestions = JSON.parse(JSON.stringify(masterQuestionsDB));

const sectorsData = [
    { score: 0 }, { score: 100 }, { score: 200 }, { score: 300 }, { score: 400 }, { score: 500 },
    { score: 0 }, { score: 100 }, { score: 200 }, { score: 300 }, { score: 400 }, { score: 500 },
    { score: 0 }, { score: 100 }, { score: 200 }, { score: 300 }, { score: 400 }, { score: 500 },
    { score: 0 }, { score: 100 }, { score: 200 }, { score: 300 }, { score: 400 }, { score: 500 }
];

const colors = [
    '#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#1abc9c', '#3498db',
    '#9b59b6', '#e84393', '#fdcb6e', '#00b894', '#0984e3', '#6c5ce7',
    '#fab1a0', '#55efc4', '#81ecec', '#74b9ff', '#a29bfe', '#ffeaa7',
    '#ff7675', '#fd79a8', '#00cec9', '#ffeaa7', '#fab1a0', '#e17055'
];

let startAngle = 0;
let outsideRadius = 190;
let textRadius = 135;
let ctxCenter = 210;

function drawWheel() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    for (let i = 0; i < numSectors; i++) {
        let angle = startAngle + i * arc;
        
        ctx.beginPath();
        ctx.moveTo(ctxCenter, ctxCenter);
        ctx.arc(ctxCenter, ctxCenter, outsideRadius, angle, angle + arc, false);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();

        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
        ctx.shadowBlur = 4;
        ctx.font = "bold 14px Arial";
        ctx.translate(
            ctxCenter + Math.cos(angle + arc / 2) * textRadius,
            ctxCenter + Math.sin(angle + arc / 2) * textRadius
        );
        ctx.rotate(angle + arc / 2 + Math.PI / 2);
        let text = sectorsData[i].score.toString();
        ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
        ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(ctxCenter, ctxCenter, 25, 0, 2 * Math.PI);
    ctx.fillStyle = "#ffd700";
    ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
    ctx.shadowBlur = 6;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#fff";
    ctx.stroke();
}

let spinAngleStart = 0;
let spinTime = 0;
let spinTimeTotal = 0;

function spinWheel() {
    document.getElementById('spinBtn').disabled = true;
    spinAngleStart = Math.random() * 20 + 25;
    spinTime = 0;
    spinTimeTotal = Math.random() * 2500 + 3000;
    rotateWheel();
}

function rotateWheel() {
    spinTime += 30;
    if (spinTime >= spinTimeTotal) {
        stopRotateWheel();
        return;
    }
    let spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
    startAngle += (spinAngle * Math.PI / 180);
    drawWheel();
    setTimeout(rotateWheel, 30);
}

function easeOut(t, b, c, d) {
    let ts = (t /= d) * t;
    let tc = ts * t;
    return b + c * (tc + -3 * ts + 3 * t);
}

function stopRotateWheel() {
    let degrees = startAngle * 180 / Math.PI + 90;
    let arcd = arc * 180 / Math.PI;
    let index = Math.floor((360 - (degrees % 360)) / arcd) % numSectors;
    
    currentScoreValue = sectorsData[index].score;
    
    document.getElementById('spinBtn').style.display = 'none';
    document.getElementById('questionBox').style.display = 'block';
    
    loadQuestion(currentScoreValue);
}

function loadQuestion(scoreVal) {
    if (scoreVal === 0) {
        document.getElementById('scoreBadge').innerText = "0 Punti (Pausa)";
        document.getElementById('questionText').innerText = "Turno di pausa! Nessuna domanda per questo giro.";
        const optionsContainer = document.getElementById('optionsContainer');
        optionsContainer.innerHTML = '';
        document.getElementById('feedback').innerText = "Il turno passa all'altra squadra.";
        document.getElementById('nextTurnBtn').style.display = 'block';
        currentActiveQuestion = null;
        return;
    }

    if (!availableQuestions[scoreVal] || availableQuestions[scoreVal].length === 0) {
        availableQuestions[scoreVal] = JSON.parse(JSON.stringify(masterQuestionsDB[scoreVal]));
    }

    document.getElementById('scoreBadge').innerText = `Punteggio in palio: ${scoreVal} punti`;
    
    const pool = availableQuestions[scoreVal];
    const randIdx = Math.floor(Math.random() * pool.length);
    const qObj = pool.splice(randIdx, 1)[0];
    currentActiveQuestion = qObj;

    document.getElementById('questionText').innerText = qObj.q;
    
    const optionsContainer = document.getElementById('optionsContainer');
    optionsContainer.innerHTML = '';
    document.getElementById('feedback').innerText = '';
    document.getElementById('nextTurnBtn').style.display = 'none';

    let opts = qObj.options.map((opt, idx) => ({ text: opt, isCorrect: idx === qObj.correct }));
    opts.sort(() => Math.random() - 0.5);

    opts.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = item.text;
        btn.onclick = () => checkAnswer(item.isCorrect, btn, opts);
        optionsContainer.appendChild(btn);
    });
}

function checkAnswer(isCorrect, selectedBtn, opts) {
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(b => b.disabled = true);

    const feedback = document.getElementById('feedback');

    if (isCorrect) {
        selectedBtn.classList.add('correct');
        feedback.style.color = '#22c55e';
        feedback.innerText = `CORRETTO! +${currentScoreValue} punti. ${currentActiveQuestion.explanation}`;
        scores[currentPlayer] += currentScoreValue;
        updateScoreboard();
        checkWinCondition();
    } else {
        selectedBtn.classList.add('incorrect');
        feedback.style.color = '#ef4444';
        feedback.innerText = `ERRATO! ${currentActiveQuestion.explanation}`;
        buttons.forEach((b, idx) => {
            if (opts[idx].isCorrect) b.classList.add('correct');
        });
    }

    document.getElementById('nextTurnBtn').style.display = 'block';
}

function updateScoreboard() {
    document.getElementById('p1Score').innerText = scores[1] + " pt";
    document.getElementById('p2Score').innerText = scores[2] + " pt";
}

function checkWinCondition() {
    if (scores[1] >= 1500 || scores[2] >= 1500) {
        document.getElementById('gameActiveArea').style.display = 'none';
        document.getElementById('wheelWrapper').style.display = 'none';
        const winner = scores[1] >= 1500 ? "SQUADRA 1" : "SQUADRA 2";
        document.getElementById('winnerText').innerText = `🎉 LA ${winner} HA VINTO LA PARTITA RAGGIUNGENDO 1500 PUNTI! 🎉`;
        document.getElementById('winnerScreen').style.display = 'block';
    }
}

function nextTurn() {
    if (scores[1] >= 1500 || scores[2] >= 1500) return;

    currentPlayer = currentPlayer === 1 ? 2 : 1;
    document.getElementById('p1Card').classList.toggle('active', currentPlayer === 1);
    document.getElementById('p2Card').classList.toggle('active', currentPlayer === 2);
    document.getElementById('turnInfo').innerText = `Tocca alla Squadra ${currentPlayer}`;

    document.getElementById('questionBox').style.display = 'none';
    document.getElementById('spinBtn').style.display = 'block';
    document.getElementById('spinBtn').disabled = false;
}

function resetGame() {
    scores = { 1: 0, 2: 0 };
    currentPlayer = 1;
    availableQuestions = JSON.parse(JSON.stringify(masterQuestionsDB));
    updateScoreboard();
    document.getElementById('p1Card').classList.add('active');
    document.getElementById('p2Card').classList.remove('active');
    document.getElementById('turnInfo').innerText = "Tocca alla Squadra 1";
    document.getElementById('winnerScreen').style.display = 'none';
    document.getElementById('gameActiveArea').style.display = 'block';
    document.getElementById('wheelWrapper').style.display = 'block';
    document.getElementById('questionBox').style.display = 'none';
    document.getElementById('spinBtn').style.display = 'block';
    document.getElementById('spinBtn').disabled = false;
    drawWheel();
}

drawWheel();
</script>
