        const wheel = document.getElementById('wheel');

        const optionsContainer = document.getElementById('options-container');

        function createWheel() {
            const angleStep = 360 / sectors.length;
            sectors.forEach((s, i) => {
                const angle = i * angleStep;
                let color;
                if(s.type === 'bankrupt') color = '#1a1a1a';
                else if(s.type === 'zero') color = '#94a3b8';
                else color = i % 2 === 0 ? '#dc2626' : '#2563eb';
                
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                const x1 = 50 + 50 * Math.cos(Math.PI * (angle - 90) / 180);
                const y1 = 50 + 50 * Math.sin(Math.PI * (angle - 90) / 180);
                const x2 = 50 + 50 * Math.cos(Math.PI * (angle + angleStep - 90) / 180);
                const y2 = 50 + 50 * Math.sin(Math.PI * (angle + angleStep - 90) / 180);
                
                path.setAttribute("d", `M 50 50 L ${x1} ${y1} A 50 50 0 0 1 ${x2} ${y2} Z`);
                path.setAttribute("fill", color);
                path.setAttribute("stroke", "white");
                path.setAttribute("stroke-width", "0.5");
                wheel.appendChild(path);

                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                const textAngle = angle + (angleStep / 2);
                const radius = 38;
                const tx = 50 + radius * Math.cos(Math.PI * (textAngle - 90) / 180);
                const ty = 50 + radius * Math.sin(Math.PI * (textAngle - 90) / 180);
                
                text.setAttribute("x", tx);
                text.setAttribute("y", ty);
                text.setAttribute("fill", "white");
                text.setAttribute("font-size", s.label.length > 7 ? "2" : "3");
                text.setAttribute("font-weight", "900");
                text.setAttribute("text-anchor", "middle");
                text.setAttribute("dominant-baseline", "middle");
                text.setAttribute("transform", `rotate(${textAngle}, ${tx}, ${ty})`);
                text.textContent = s.label;
                wheel.appendChild(text);
            });
        }

        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            if (availableQuestions.length === 0) {
                customAlert("FINE GIOCO", "Domande esaurite!");
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.classList.add('opacity-30');

            const numSectors = sectors.length;
            const sectorAngle = 360 / numSectors;
            const stopAtSector = Math.floor(Math.random() * numSectors);
            
            const giriExtra = (5 + Math.floor(Math.random() * 3)) * 360;
            const targetAngle = stopAtSector * sectorAngle;
            
            // Per portare il settore in cima (ore 12), calcolo la rotazione necessaria
            const finalRotationForSector = 360 - targetAngle;
            const currentMod = totalRotation % 360;
            
            totalRotation += giriExtra + (finalRotationForSector - currentMod);
            wheel.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                spinBtn.classList.remove('opacity-30');
                handleSpinResult(sectors[stopAtSector]);
            }, 5000);
        });

        function handleSpinResult(sector) {
            if (sector.type === 'bankrupt') {
                scores[currentPlayer] = 0;
                updateScoresDisplay();
                customAlert("💥 BANCAROTTA!", "Hai perso tutto! Il turno passa al prossimo giocatore.", () => switchTurn());
            } else if (sector.type === 'zero') {
                customAlert("⚪ ZERO!", "Nessun punto. Il turno passa al prossimo giocatore.", () => switchTurn());
            } else {
                showQuestion(sector.value);
            }
        }

        function showQuestion(value) {
            const qIdx = Math.floor(Math.random() * availableQuestions.length);
            const qObj = availableQuestions.splice(qIdx, 1)[0];
            document.getElementById('q-count').textContent = availableQuestions.length;

            qText.textContent = qObj.q;
            optionsContainer.innerHTML = '';
            
            const playerTag = document.getElementById('modal-player-tag');
            playerTag.textContent = `PLAYER ${currentPlayer + 1}`;
            playerTag.style.backgroundColor = currentPlayer === 0 ? "#2563eb" : "#1e293b";
            
            document.getElementById('modal-value-tag').textContent = `VALORE: ${value} PT`;

            const opts = [{ text: qObj.a, correct: true }];
            qObj.o.forEach(o => opts.push({ text: o, correct: false }));
            opts.sort(() => Math.random() - 0.5);

            opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-6 rounded-2xl border-4 border-slate-100 hover:border-blue-500 hover:bg-blue-50 transition-all font-bold text-slate-800 shadow-sm flex justify-between items-center group";
                btn.innerHTML = `<span>${opt.text}</span><span class="opacity-0 group-hover:opacity-100 transition-opacity text-blue-600">▶</span>`;
                btn.onclick = () => {
                    qModal.classList.remove('active');
                    if (opt.correct) {
                        scores[currentPlayer] += value;
                        updateScoresDisplay();
                        if (scores[currentPlayer] >= 1500) {
                            victory();
                        } else {
                            customAlert("✅ CORRETTO!", `Hai vinto ${value} punti! Ora tocca al tuo avversario.`, () => switchTurn());
                        }
                    } else {
                        customAlert("❌ ERRORE!", "Risposta sbagliata. Il turno passa al tuo avversario.", () => switchTurn());
                    }
                };
                optionsContainer.appendChild(btn);
            });

            qModal.classList.add('active');
        }

        function switchTurn() {
            currentPlayer = (currentPlayer === 0) ? 1 : 0;
            
            const p1 = document.getElementById('p1-card');
            const p2 = document.getElementById('p2-card');
            const announcer = document.getElementById('turn-announcer');
            
            if(currentPlayer === 0) {
                p1.className = "player-card w-full lg:w-1/4 p-8 rounded-3xl active-p1 text-center";
                p2.className = "player-card w-full lg:w-1/4 p-8 rounded-3xl inactive-card text-center";
                document.getElementById('p1-score').className = "text-6xl font-black text-blue-600 my-3";
                document.getElementById('p2-score').className = "text-6xl font-black text-slate-300 my-3";
                announcer.textContent = "Tocca al Giocatore 1";
                announcer.className = "mt-4 font-black text-blue-400 uppercase text-sm tracking-widest";
            } else {
                p1.className = "player-card w-full lg:w-1/4 p-8 rounded-3xl inactive-card text-center";
                p2.className = "player-card w-full lg:w-1/4 p-8 rounded-3xl active-p2 text-center";
                document.getElementById('p1-score').className = "text-6xl font-black text-slate-300 my-3";
                document.getElementById('p2-score').className = "text-6xl font-black text-slate-800 my-3";
                announcer.textContent = "Tocca al Giocatore 2";
                announcer.className = "mt-4 font-black text-slate-900 uppercase text-sm tracking-widest";
            }
        }

        function updateScoresDisplay() {
            document.getElementById('p1-score').textContent = scores[0];
            document.getElementById('p2-score').textContent = scores[1];
        }

        function customAlert(title, message, callback) {
            const alertDiv = document.createElement('div');
            alertDiv.className = "fixed inset-0 z-[200] flex items-center justify-center bg-black/80 backdrop-blur-md p-4";
            alertDiv.innerHTML = `
                <div class="bg-white rounded-[2rem] p-10 max-w-sm w-full shadow-2xl text-center border-b-8 border-slate-300 transform scale-110">
                    <h2 class="text-3xl font-black mb-3 text-slate-900 tracking-tighter uppercase">${title}</h2>
                    <p class="text-slate-500 mb-8 font-bold leading-relaxed">${message}</p>
                    <button id="close-alert" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black hover:bg-black transition-all shadow-lg active:scale-95">CONTINUA</button>
                </div>
            `;
            document.body.appendChild(alertDiv);
            document.getElementById('close-alert').onclick = () => {
                document.body.removeChild(alertDiv);
                if(callback) callback();
            };
        }

        function victory() {
            confetti({ particleCount: 250, spread: 120, origin: { y: 0.6 } });
            setTimeout(() => {
                customAlert("🏆 CAMPIONE!", `IL GIOCATORE ${currentPlayer + 1} HA VINTO LA PARTITA!`, () => location.reload());
            }, 500);
        }

        function guardarComoArchivo() {
            const contenido = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([contenido], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ruota_fortuna_alternanza_corretta.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        window.onload = createWheel;
    </script>

</body></html>
