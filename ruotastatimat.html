<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Ruota della Fortuna - Modulo 2 (Stati di Aggregazione)</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel-bg: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
        h1 {
            margin-bottom: 5px;
            color: #38bdf8;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            text-align: center;
            font-size: 1.8rem;
        }
        p.subtitle {
            color: #94a3b8;
            margin-bottom: 15px;
            text-align: center;
            font-size: 0.95rem;
        }
        .scoreboard {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        .player-card {
            background: var(--panel-bg);
            padding: 10px 25px;
            border-radius: 12px;
            border: 2px solid #334155;
            text-align: center;
            min-width: 140px;
            transition: all 0.3s;
        }
        .player-card.active {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            transform: scale(1.05);
        }
        .player-card h3 {
            margin: 0 0 5px 0;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        .player-card .score {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffd700;
        }
        .main-container {
            display: flex;
            gap: 40px;
            align-items: center;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            flex-wrap: wrap;
            justify-content: center;
        }
        .wheel-container {
            position: relative;
            width: 420px;
            height: 420px;
        }
        canvas {
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
            background: #1e293b;
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 35px solid #ef4444;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.5));
            z-index: 10;
        }
        .panel {
            width: 400px;
            background: #0f172a;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #334155;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .turn-info {
            font-size: 1.1rem;
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }
        button.spin-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 15px;
        }
        button.spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .question-box {
            display: none;
            margin-top: 10px;
        }
        .question-text {
            font-size: 0.95rem;
            margin-bottom: 12px;
            line-height: 1.4;
            color: #f1f5f9;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .option-btn {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .option-btn:hover:not(:disabled) {
            background: #334155;
            border-color: #38bdf8;
        }
        .option-btn.correct {
            background: #166534 !important;
            border-color: #22c55e !important;
        }
        .option-btn.incorrect {
            background: #991b1b !important;
            border-color: #ef4444 !important;
        }
        .feedback {
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
            font-size: 0.9rem;
        }
        .next-turn-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            display: none;
        }
        .next-turn-btn:hover {
            background: var(--accent-hover);
        }
        .winner-screen {
            display: none;
            text-align: center;
        }
        .winner-screen h2 {
            color: #ffd700;
            font-size: 2rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <h1>Ruota della Fortuna - Modulo 2 (Stati di Aggregazione)</h1>
    <p class="subtitle">24 Settori • Punteggi da 0 a 500 • Traguardo vittoria: 1500 punti</p>

    <div class="scoreboard">
        <div id="p1Card" class="player-card active">
            <h3>SQUADRA 1</h3>
            <div id="p1Score" class="score">0 pt</div>
        </div>
        <div id="p2Card" class="player-card">
            <h3>SQUADRA 2</h3>
            <div id="p2Score" class="score">0 pt</div>
        </div>
    </div>

    <div class="main-container">
        <div class="wheel-container" id="wheelWrapper">
            <div class="pointer"></div>
            <canvas id="wheel" width="420" height="420"></canvas>
        </div>

        <div class="panel">
            <div id="gameActiveArea">
                <div id="turnInfo" class="turn-info">Tocca alla Squadra 1</div>
                <div id="actionArea">
                    <button id="spinBtn" class="spin-btn" onclick="spinWheel()">GIRA LA RUOTA</button>
                </div>
                
                <div id="questionBox" class="question-box">
                    <div id="scoreBadge" style="color: #ffd700; font-weight: bold; margin-bottom: 8px;"></div>
                    <div id="questionText" class="question-text"></div>
                    <div id="optionsContainer" class="options-container"></div>
                    <div id="feedback" class="feedback"></div>
                    <button id="nextTurnBtn" class="next-turn-btn" onclick="nextTurn()">PROSSIMO TURNO</button>
                </div>
            </div>

            <div id="winnerScreen" class="winner-screen">
                <h2 id="winnerText"></h2>
                <button class="spin-btn" onclick="resetGame()">GIOCA ANCORA</button>
            </div>
        </div>
    </div>

<script>
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const numSectors = 24;
const arc = (2 * Math.PI) / numSectors;

let currentPlayer = 1;
let scores = { 1: 0, 2: 0 };
let currentScoreValue = 0;
let currentActiveQuestion = null;

const masterQuestionsDB = {
    100: [
        { id: 1, q: "Quali sono i tre stati di aggregazione della materia citati nel modulo?", options: ["Aeriforme, liquido e solido", "Plasma, liquido e solido", "Gas, vapore e solido", "Solido, liquido e colloidale"], correct: 0, explanation: "Gli stati di aggregazione della materia sono tre: aeriforme (gassoso), liquido e solido." },
        { id: 2, q: "Come vengono generalmente definiti i liquidi e i gas insieme?", options: ["Fluidi", "Aeriformi", "Soluzioni", "Colloidi"], correct: 0, explanation: "I liquidi e gas sono generalmente definiti fluidi." },
        { id: 3, q: "Quali stati di aggregazione interessano particolarmente in campo dentale?", options: ["Solidi e liquidi", "Solo aeriformi", "Plasma e gas", "Solidi e gas"], correct: 0, explanation: "In campo dentale interessano particolarmente i solidi ed i liquidi." },
        { id: 4, q: "Come si chiama il passaggio di stato da solido a liquido?", options: ["Fusione", "Solidificazione", "Evaporazione", "Sublimazione"], correct: 0, explanation: "Il passaggio da solido a liquido è la fusione." },
        { id: 5, q: "Come si chiama il passaggio di stato da liquido a solido?", options: ["Solidificazione", "Fusione", "Condensazione", "Brinamento"], correct: 0, explanation: "Il passaggio da liquido a solido è la solidificazione." }
    ],
    200: [
        { id: 6, q: "Come sono descritte le particelle nello stato aeriforme?", options: ["Molto distanziate e in movimento rettilineo e disordinato", "Vicine e ordinate in reticoli", "Aggregate e fisse", "Immobili e legate da forti legami"], correct: 0, explanation: "Le particelle che costituiscono la materia aeriforme sono molto distanziate tra loro e in movimento rettilineo e disordinato." },
        { id: 7, q: "Cosa sono i tensioattivi aggiunti ai liquidi?", options: ["Sostanze che riducono le tensioni superficiali", "Sostanze che aumentano la viscosità", "Sostanze che solidificano il liquido", "Catalizzatori di polimerizzazione"], correct: 0, explanation: "Aggiungendo ai liquidi le sostanze note come tensioattivi si riducono le tensioni superficiali." },
        { id: 8, q: "Come si dividono i solidi in base alla struttura interna?", options: ["Cristallini e amorfi", "Metalli e polimeri", "Solubili e insolubili", "Duri e molli"], correct: 0, explanation: "I solidi si dividono in cristallini (posizioni ordinate) e amorfi (disposti in modo disordinato)." },
        { id: 9, q: "Come si chiama il passaggio da liquido a gas?", options: ["Evaporazione", "Condensazione", "Sublimazione", "Brinamento"], correct: 0, explanation: "Il passaggio da liquido a gas è l'evaporazione." },
        { id: 10, q: "Qual è il fenomeno inverso dell'evaporazione?", options: ["Condensazione", "Fusione", "Brinamento", "Sublimazione"], correct: 0, explanation: "La condensazione è il fenomeno inverso all'evaporazione." }
    ],
    300: [
        { id: 11, q: "Quando un aeriforme viene definito GAS?", options: ["Quando ha una temperatura maggiore di quella critica", "Quando ha una temperatura inferiore a quella critica", "Quando si trova alla pressione atmosferica", "Quando non può essere liquefatto mai"], correct: 0, explanation: "Se l'aeriforme ha una temperatura maggiore di quella critica esso è definito GAS." },
        { id: 12, q: "Cosa sono le celle elementari in un reticolo cristallino?", options: ["La ripetizione periodica di parallelepipedi tutti uguali tra loro", "I bordi di contatto tra i grani", "Le impurezze presenti nel solido", "I legami covalenti del carbonio"], correct: 0, explanation: "Ogni reticolo cristallino può essere considerato una ripetizione periodica di parallelepipedi chiamati celle elementari." },
        { id: 13, q: "Cosa sono i SOL nei colloidi?", options: ["Dispersioni di solidi in liquidi (consistenza viscosa)", "Colloidi con consistenza gelatinosa", "Liquidi dispersi in altri liquidi", "Particelle disperse in un aeriforme"], correct: 0, explanation: "I soli sono costituiti da dispersione di solidi in liquidi, ottenendo un colloide di consistenza più o meno viscosa." },
        { id: 14, q: "Come si chiama il passaggio diretto da solido a gas?", options: ["Sublimazione", "Brinamento", "Evaporazione", "Fusione"], correct: 0, explanation: "Il passaggio diretto da solido a gas è la sublimazione." },
        { id: 15, q: "Come si chiama il passaggio diretto da gas a solido?", options: ["Brinamento", "Sublimazione", "Condensazione", "Solidificazione"], correct: 0, explanation: "Il passaggio diretto da gas a solido è il brinamento." },
        { id: 16, q: "Cosa sono i GEL nei colloidi?", options: ["Colloidi con consistenza gelatinosa", "Dispersioni di solidi in liquidi viscosi", "Liquidi dispersi in altri liquidi", "Gas dispersi in aeriformi"], correct: 0, explanation: "I geli sono colloidi con consistenza gelatinosa." },
        { id: 17, q: "Cos'è un'emulsione?", options: ["Un liquido disperso in un altro liquido", "Un solido disperso in un gas", "Un soluto gassoso in un liquido", "Un solido vetroso amorfo"], correct: 0, explanation: "L'emulsione è un liquido disperso in un altro liquido." },
        { id: 18, q: "Cos'è un aerosol?", options: ["Particelle liquide o solide disperse in un aeriforme", "Un gas disciolto in un solido", "Un colloide gelatinoso", "Una soluzione satura di sali"], correct: 0, explanation: "L'aerosol è costituito da particelle liquide o solide disperse in un aeriforme." }
    ],
    400: [
        { id: 19, q: "Cos'è la temperatura critica per un aeriforme?", options: ["La temperatura sotto la quale può essere liquefatto aumentando la pressione", "La temperatura di ebollizione a pressione ambiente", "La temperatura minima di fusione del solido", "La temperatura di transizione vetrosa"], correct: 0, explanation: "Un aeriforme può essere liquefatto aumentando la pressione solo se la sua temperatura è inferiore alla temperatura critica." },
        { id: 20, q: "Cosa sono i difetti di tipo 'vacanze' nei reticoli cristallini?", options: ["Mancanza di uno o più atomi nel reticolo", "La presenza di sostanze estranee", "Piani incompleti di atomi", "I punti di contatto tra i grani"], correct: 0, explanation: "Le vacanze sono difetti costituiti dalla mancanza di uno o più atomi nel reticolo." },
        { id: 21, q: "Qual è la differenza tra idrocolloidi reversibili (es. AGAR) e irreversibili (es. ALGINATI)?", options: ["Negli irreversibili non è possibile il ritorno da idrogel a idrosol", "Negli irreversibili non si può passare da sol a gel", "Gli irreversibili non usano acqua come mezzo disperdente", "Non c'è alcuna differenza pratica"], correct: 0, explanation: "Negli idrocolloidi irreversibili è possibile il passaggio da idrosol a idrogel ma non il viceversa." },
        { id: 22, q: "Cosa accade alla temperatura di fusione di una sostanza pura?", options: ["Resta costante fino a che tutto il solido non diventa liquido", "Aumenta continuamente durante la fusione", "Diminuisce rapidamente all'aumentare del calore", "Oscilla in base alla pressione esterna"], correct: 0, explanation: "La temperatura di fusione resta costante fino a che tutto il solido non diventa liquido." },
        { id: 23, q: "Cosa presentano le soluzioni solide durante la fusione?", options: ["Un intervallo di fusione anziché una temperatura fissa", "Una temperatura di fusione istantanea", "Un punto di ebollizione costante", "Nessuna variazione di stato"], correct: 0, explanation: "Le soluzioni solide presentano in realtà un intervallo di fusione." },
        { id: 24, q: "Cosa presentano i solidi amorfi (vetri) quando vengono riscaldati?", options: ["Un intervallo di rammollimento", "Una temperatura di fusione netta", "Un punto critico gassoso", "Una sublimazione istantanea"], correct: 0, explanation: "I solidi amorfi presentano un intervallo di rammollimento." }
    ],
    500: [
        { id: 25, q: "Cos'è il POLIMORFISMO in campo dentale (es. nella silice SiO2)?", options: ["La proprietà per cui un composto può esistere in forme cristalline differenti (quarzo, tridimite, cristobalite)", "La variazione di legame chimico come grafite e diamante", "La presenza di dislocazioni che causano plasticità", "Il passaggio diretto da solido a gas"], correct: 0, explanation: "Il polimorfismo si ha quando un elemento o composto (come la silice SiO2) esiste in forme cristalline differenti." },
        { id: 26, q: "Quali sono i principali responsabili della plasticità dei metalli sotto sollecitazione esterna?", options: ["Le dislocazioni (piani incompleti di atomi che si muovono con facilità)", "La presenza di idrochinone stabilizzante", "I tensioattivi anionici", "La tensione superficiale elevata"], correct: 0, explanation: "Le dislocazioni nei metalli si muovono con facilità sotto sollecitazione e sono i principali responsabili della plasticità." },
        { id: 27, q: "Cosa descrive la tensione di vapore in un recipiente chiuso?", options: ["La pressione che si instaura quando le particelle che si allontanano eguagliano quelle che ritornano", "La pressione massima prima dell'ebollizione istantanea", "La forza della membrana elastica superficiale", "Il punto critico di liquefazione"], correct: 0, explanation: "In un recipiente chiuso si arriva a un punto in cui le particelle che si allontanano eguagliano quelle che ritornano: la pressione è la tensione di vapore." },
        { id: 28, q: "Cos'è l'ALLOTROPIA nei materiali?", options: ["Quando uno stesso elemento o composto presenta strutture diverse per variazioni di legame (es. carbonio grafite e diamante)", "La capacità di formare soluzioni solide di sostituzione", "Il passaggio da idrosol a idrogel", "La riduzione della tensione superficiale per azione termica"], correct: 0, explanation: "L'allotropia si ha quando uno stesso elemento o composto presenta strutture diverse per variazioni di legame." },
        { id: 29, q: "Cosa sono i giunti (o bordi) dei grani in un solido policristallino?", options: ["I punti di contatto tra i diversi cristalli", "I legami covalenti interni al singolo cristallo", "I nodi geometrici della cella elementare", "Le impurezze gassose interstiziali"], correct: 0, explanation: "I punti di contatto tra i diversi cristalli quando vanno a formare un solido policristallino sono definiti giunti dei grani." },
        { id: 30, q: "Cosa si intende per solubilità in una soluzione?", options: ["La concentrazione massima in cui il soluto si scioglie completamente nel solvente", "Il rapporto esatto tra solvente e soluto gassoso", "La velocità di ebollizione della soluzione", "La pressione esercitata dal corpo di fondo"], correct: 0, explanation: "La solubilità è la concentrazione massima in cui il soluto si scioglie completamente nel solvente." }
    ]
};

let availableQuestions = JSON.parse(JSON.stringify(masterQuestionsDB));

const sectorsData = [
    { score: 0 }, { score: 100 }, { score: 200 }, { score: 300 }, { score: 400 }, { score: 500 },
    { score: 0 }, { score: 100 }, { score: 200 }, { score: 300 }, { score: 400 }, { score: 500 },
    { score: 0 }, { score: 100 }, { score: 200 }, { score: 300 }, { score: 400 }, { score: 500 },
    { score: 0 }, { score: 100 }, { score: 200 }, { score: 300 }, { score: 400 }, { score: 500 }
];

const colors = [
    '#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#1abc9c', '#3498db',
    '#9b59b6', '#e84393', '#fdcb6e', '#00b894', '#0984e3', '#6c5ce7',
    '#fab1a0', '#55efc4', '#81ecec', '#74b9ff', '#a29bfe', '#ffeaa7',
    '#ff7675', '#fd79a8', '#00cec9', '#ffeaa7', '#fab1a0', '#e17055'
];

let startAngle = 0;
let outsideRadius = 190;
let textRadius = 135;
let ctxCenter = 210;

function drawWheel() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    for (let i = 0; i < numSectors; i++) {
        let angle = startAngle + i * arc;
        
        ctx.beginPath();
        ctx.moveTo(ctxCenter, ctxCenter);
        ctx.arc(ctxCenter, ctxCenter, outsideRadius, angle, angle + arc, false);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();

        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
        ctx.shadowBlur = 4;
        ctx.font = "bold 14px Arial";
        ctx.translate(
            ctxCenter + Math.cos(angle + arc / 2) * textRadius,
            ctxCenter + Math.sin(angle + arc / 2) * textRadius
        );
        ctx.rotate(angle + arc / 2 + Math.PI / 2);
        let text = sectorsData[i].score.toString();
        ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
        ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(ctxCenter, ctxCenter, 25, 0, 2 * Math.PI);
    ctx.fillStyle = "#ffd700";
    ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
    ctx.shadowBlur = 6;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#fff";
    ctx.stroke();
}

let spinAngleStart = 0;
let spinTime = 0;
let spinTimeTotal = 0;

function spinWheel() {
    document.getElementById('spinBtn').disabled = true;
    spinAngleStart = Math.random() * 20 + 25;
    spinTime = 0;
    spinTimeTotal = Math.random() * 2500 + 3000;
    rotateWheel();
}

function rotateWheel() {
    spinTime += 30;
    if (spinTime >= spinTimeTotal) {
        stopRotateWheel();
        return;
    }
    let spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
    startAngle += (spinAngle * Math.PI / 180);
    drawWheel();
    setTimeout(rotateWheel, 30);
}

function easeOut(t, b, c, d) {
    let ts = (t /= d) * t;
    let tc = ts * t;
    return b + c * (tc + -3 * ts + 3 * t);
}

function stopRotateWheel() {
    let degrees = startAngle * 180 / Math.PI + 90;
    let arcd = arc * 180 / Math.PI;
    let index = Math.floor((360 - (degrees % 360)) / arcd) % numSectors;
    
    currentScoreValue = sectorsData[index].score;
    
    document.getElementById('spinBtn').style.display = 'none';
    document.getElementById('questionBox').style.display = 'block';
    
    loadQuestion(currentScoreValue);
}

function loadQuestion(scoreVal) {
    if (scoreVal === 0) {
        document.getElementById('scoreBadge').innerText = "0 Punti (Pausa)";
        document.getElementById('questionText').innerText = "Turno di pausa! Nessuna domanda per questo giro.";
        const optionsContainer = document.getElementById('optionsContainer');
        optionsContainer.innerHTML = '';
        document.getElementById('feedback').innerText = "Il turno passa all'altra squadra.";
        document.getElementById('nextTurnBtn').style.display = 'block';
        currentActiveQuestion = null;
        return;
    }

    if (!availableQuestions[scoreVal] || availableQuestions[scoreVal].length === 0) {
        availableQuestions[scoreVal] = JSON.parse(JSON.stringify(masterQuestionsDB[scoreVal]));
    }

    document.getElementById('scoreBadge').innerText = `Punteggio in palio: ${scoreVal} punti`;
    
    const pool = availableQuestions[scoreVal];
    const randIdx = Math.floor(Math.random() * pool.length);
    const qObj = pool.splice(randIdx, 1)[0];
    currentActiveQuestion = qObj;

    document.getElementById('questionText').innerText = qObj.q;
    
    const optionsContainer = document.getElementById('optionsContainer');
    optionsContainer.innerHTML = '';
    document.getElementById('feedback').innerText = '';
    document.getElementById('nextTurnBtn').style.display = 'none';

    let opts = qObj.options.map((opt, idx) => ({ text: opt, isCorrect: idx === qObj.correct }));
    opts.sort(() => Math.random() - 0.5);

    opts.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = item.text;
        btn.onclick = () => checkAnswer(item.isCorrect, btn, opts);
        optionsContainer.appendChild(btn);
    });
}

function checkAnswer(isCorrect, selectedBtn, opts) {
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(b => b.disabled = true);

    const feedback = document.getElementById('feedback');

    if (isCorrect) {
        selectedBtn.classList.add('correct');
        feedback.style.color = '#22c55e';
        feedback.innerText = `CORRETTO! +${currentScoreValue} punti. ${currentActiveQuestion.explanation}`;
        scores[currentPlayer] += currentScoreValue;
        updateScoreboard();
        checkWinCondition();
    } else {
        selectedBtn.classList.add('incorrect');
        feedback.style.color = '#ef4444';
        feedback.innerText = `ERRATO! ${currentActiveQuestion.explanation}`;
        buttons.forEach((b, idx) => {
            if (opts[idx].isCorrect) b.classList.add('correct');
        });
    }

    document.getElementById('nextTurnBtn').style.display = 'block';
}

function updateScoreboard() {
    document.getElementById('p1Score').innerText = scores[1] + " pt";
    document.getElementById('p2Score').innerText = scores[2] + " pt";
}

function checkWinCondition() {
    if (scores[1] >= 1500 || scores[2] >= 1500) {
        document.getElementById('gameActiveArea').style.display = 'none';
        document.getElementById('wheelWrapper').style.display = 'none';
        const winner = scores[1] >= 1500 ? "SQUADRA 1" : "SQUADRA 2";
        document.getElementById('winnerText').innerText = `🎉 LA ${winner} HA VINTO LA PARTITA RAGGIUNGENDO 1500 PUNTI! 🎉`;
        document.getElementById('winnerScreen').style.display = 'block';
    }
}

function nextTurn() {
    if (scores[1] >= 1500 || scores[2] >= 1500) return;

    currentPlayer = currentPlayer === 1 ? 2 : 1;
    document.getElementById('p1Card').classList.toggle('active', currentPlayer === 1);
    document.getElementById('p2Card').classList.toggle('active', currentPlayer === 2);
    document.getElementById('turnInfo').innerText = `Tocca alla Squadra ${currentPlayer}`;

    document.getElementById('questionBox').style.display = 'none';
    document.getElementById('spinBtn').style.display = 'block';
    document.getElementById('spinBtn').disabled = false;
}

function resetGame() {
    scores = { 1: 0, 2: 0 };
    currentPlayer = 1;
    availableQuestions = JSON.parse(JSON.stringify(masterQuestionsDB));
    updateScoreboard();
    document.getElementById('p1Card').classList.add('active');
    document.getElementById('p2Card').classList.remove('active');
    document.getElementById('turnInfo').innerText = "Tocca alla Squadra 1";
    document.getElementById('winnerScreen').style.display = 'none';
    document.getElementById('gameActiveArea').style.display = 'block';
    document.getElementById('wheelWrapper').style.display = 'block';
    document.getElementById('questionBox').style.display = 'none';
    document.getElementById('spinBtn').style.display = 'block';
    document.getElementById('spinBtn').disabled = false;
    drawWheel();
}

drawWheel();
</script>
