<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criptograma Odontotecnica - 10 Livelli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fde047;
            background-image: radial-gradient(#facc15 2px, transparent 2px);
            background-size: 20px 20px;
            font-family: 'Open Sans', sans-serif;
        }
        h1, .comic-font { font-family: 'Bangers', cursive; }
        .comic-panel {
            background: white;
            border: 4px solid black;
            box-shadow: 8px 8px 0px black;
        }
        .speech-bubble {
            position: relative;
            background: #ffffff;
            border: 3px solid #000;
            border-radius: 1.5em;
            padding: 12px;
        }
        .speech-bubble:after {
            content: '';
            position: absolute;
            bottom: 0; left: 20px;
            width: 0; height: 0;
            border: 15px solid transparent;
            border-top-color: #000;
            border-bottom: 0; border-left: 0;
            margin-bottom: -15px;
        }
        .letter-box {
            width: 40px;
            height: 65px;
            border: 2px solid black;
            display: inline-flex;
            flex-direction: column;
            margin: 2px;
            background: white;
        }
        .number-hint {
            font-size: 0.9rem;
            color: #ef4444;
            font-weight: 800;
            background: #fee2e2;
            text-align: center;
            border-top: 1px solid black;
        }
        .input-letter {
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            text-transform: uppercase;
            border: none; outline: none;
            color: #1e40af;
        }
        .input-letter:focus { background: #bae6fd; }
        .pow-label {
            background: #ef4444;
            color: white;
            padding: 4px 12px;
            transform: rotate(-3deg);
            border: 2px solid black;
            display: inline-block;
        }
        .btn-download, .btn-print-pdf {
            position: fixed;
            background: #10b981;
            color: white;
            border: 3px solid black;
            padding: 12px 20px;
            font-family: 'Bangers', cursive;
            font-size: 1.2rem;
            box-shadow: 5px 5px 0px black;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 100;
        }
        .btn-download { bottom: 20px; right: 20px; }
        .btn-print-pdf { bottom: 20px; right: 220px; background: #3b82f6; }
        
        .btn-download:hover, .btn-print-pdf:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px black;
        }
        .btn-print-pdf:hover { background: #2563eb; }

        @media print {
            body { background: white !important; }
            .btn-download, .btn-print-pdf, #btn-check, #btn-next, button { display: none !important; }
            .comic-panel { box-shadow: none !important; border: 2px solid black !important; }
            .input-letter { border-bottom: 2px solid black !important; background: transparent !important; }
        }
    </style>
</head>
<body class="p-4 md:p-6">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <div>
                <h1 class="text-5xl text-black tracking-wide">CRIPTOGRAMA ODONTOTECNICA!</h1>
                <div class="pow-label text-xl">LIVELLO <span id="level-display">1</span> / 10</div>
            </div>
            <div class="comic-panel p-3 flex items-center gap-3">
                <span class="text-4xl">🦷</span>
                <div class="speech-bubble text-xs font-bold">
                    "Decodifica il messaggio tecnico!"
                </div>
            </div>
        </div>

        <!-- Indizi -->
        <div id="hints-container" class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6"></div>

        <!-- Criptogramma -->
        <div class="comic-panel p-6 mb-6 overflow-x-auto">
            <div id="crypto-container" class="flex flex-wrap justify-center gap-y-6"></div>
        </div>

        <!-- Pulsanti -->
        <div class="flex flex-wrap gap-4 justify-center items-center">
            <button onclick="checkSolution()" id="btn-check" class="bg-black text-white px-8 py-3 text-xl font-bold hover:bg-zinc-800 transition transform hover:scale-105 active:scale-95 shadow-lg border-2 border-white">
                VERIFICA! ⚡
            </button>
            <button onclick="nextLevel()" id="btn-next" class="hidden bg-green-500 text-white px-8 py-3 text-xl font-bold hover:bg-green-600 transition transform hover:scale-105 shadow-lg border-2 border-black">
                PROSSIMA SFIDA ➡️
            </button>
            <button onclick="resetLevel()" class="bg-white text-black border-2 border-black px-4 py-3 font-bold hover:bg-zinc-100 transition shadow-md">
                RESET 🔄
            </button>
        </div>

        <div id="result-message" class="mt-6 text-center text-3xl font-bold comic-font min-h-[1.5em]"></div>

        <!-- Legenda -->
        <div class="mt-8 comic-panel p-4 bg-zinc-50">
            <h3 class="font-bold mb-3 border-b-2 border-black pb-1 text-center text-sm uppercase">Chiave di Decodifica</h3>
            <div id="symbol-legend" class="flex flex-wrap justify-center gap-2 text-xs font-bold"></div>
        </div>
    </div>

    <!-- Pulsanti Download / Stampa -->
    <button onclick="printToPDF()" class="btn-print-pdf">
        🖨️ STAMPA / PDF
    </button>
    <button onclick="downloadAsHTML()" class="btn-download">
        💾 SCARICA GIOCO .HTML
    </button>

    <script>
        const levels = [
            { f: "LA BAGNABILITA AUMENTA SABBIANDO IL SOLIDO", h: ["Modifica della rugosità superficiale", "Miglioramento dell'adesione", "Processo meccanico con ossido di alluminio"] },
            { f: "SE USO IL RIDUTTORE DI TENSIONE SUPERFICIALE AUMENTA LA SUPERFICIE DEL LIQUIDO", h: ["Interazione tra liquidi e gessi", "Riduce l'angolo di contatto", "Favorisce lo scorrimento dei materiali"] },
            { f: "LA PASSIVAZIONE AUMENTA LA RESISTENZA A CORROSIONE", h: ["Formazione di uno strato protettivo", "Tipico di leghe come il cromo cobalto", "Protegge il metallo in bocca"] },
            { f: "LA MASSA VOLUMICA CI AIUTA A CALCOLARE LA QUANTITA CORRETTA DI METALLO PER LA FUSIONE", h: ["Rapporto tra massa e volume", "Fondamentale per pesare la lega", "Evita difetti di colata"] },
            { f: "IL RITIRO DEL METALLO DIPENDE SOPRATTUTTO DALLA TEMPERATURA DI COLATA", h: ["Contrazione durante il raffreddamento", "Compensato dai rivestimenti", "Fattore critico di precisione"] },
            { f: "IL NICHEL HA BIOCOMPATIBILITA CONTROVERSA", h: ["Possibile causa di sensibilizzazione", "Presente in leghe economiche", "Richiede attenzione clinica"] },
            { f: "INTERVALLO DI FUSIONE SI HA PER LE SOLUZIONI SOLIDE", h: ["Separazione tra solidus e liquidus", "Comportamento delle leghe dentarie", "Non fondono a temperatura netta"] },
            { f: "LA CONDUCIBILITA TERMICA DI UN MATERIALE DIPENDE DAI LEGAMI CHIMICI PRESENTI", h: ["Legato agli elettroni liberi", "Importante per la protezione della polpa", "Isolamento termico protesico"] },
            { f: "I VINCOLI SONO TRE L INCASTRO IMPEDISCE QUALSIASI TIPO DI MOVIMENTO", h: ["Biomeccanica applicata", "Reazioni vincolari nei pilastri", "Stabilità strutturale"] },
            { f: "UN MATERIALE FRAGILE SE RIGIDO E DIFFICILE ROMPERLO PERCHE NON SI DEFORMA", h: ["Comportamento a rottura improvvisa", "Assenza di deformazione plastica", "Tipico delle ceramiche"] }
        ];

        let currentLevelIndex = 0;
        let numberMap = {};

        function initLevel() {
            const level = levels[currentLevelIndex];
            document.getElementById('level-display').innerText = currentLevelIndex + 1;
            document.getElementById('result-message').innerText = "";
            document.getElementById('btn-next').classList.add('hidden');
            document.getElementById('btn-check').classList.remove('hidden');
            
            const uniqueLetters = [...new Set(level.f.replace(/\s/g, '').split(''))].sort();
            const shuffledNumbers = [...Array(uniqueLetters.length).keys()].map(i => i + 1).sort(() => Math.random() - 0.5);
            
            numberMap = {};
            uniqueLetters.forEach((l, i) => numberMap[l] = shuffledNumbers[i]);

            const hintsCont = document.getElementById('hints-container');
            hintsCont.innerHTML = level.h.map((h, i) => `
                <div class="bg-white border-2 border-black p-3 rounded text-xs font-bold shadow-sm">
                    <span class="text-indigo-600 uppercase">Indizio ${i+1}:</span> ${h}
                </div>
            `).join('');

            const cryptoCont = document.getElementById('crypto-container');
            cryptoCont.innerHTML = '';
            level.f.split(' ').forEach(word => {
                const wordDiv = document.createElement('div');
                wordDiv.className = 'flex flex-wrap mr-6 mb-2';
                word.split('').forEach(letter => {
                    const box = document.createElement('div');
                    box.className = 'letter-box';
                    box.innerHTML = `
                        <input type="text" maxlength="1" class="input-letter" data-letter="${letter}" 
                               oninput="syncAll('${letter}', this.value.toUpperCase())">
                        <div class="number-hint">${numberMap[letter]}</div>
                    `;
                    wordDiv.appendChild(box);
                });
                cryptoCont.appendChild(wordDiv);
            });

            renderLegend();
        }

        function syncAll(letter, val) {
            const inputs = document.querySelectorAll(`input[data-letter="${letter}"]`);
            inputs.forEach(i => i.value = val);
            renderLegend();
        }

        function renderLegend() {
            const legend = document.getElementById('symbol-legend');
            const level = levels[currentLevelIndex];
            const uniqueLetters = [...new Set(level.f.replace(/\s/g, '').split(''))].sort();
            
            legend.innerHTML = uniqueLetters.map(l => {
                const n = numberMap[l];
                const inputVal = document.querySelector(`input[data-letter="${l}"]`)?.value || '?';
                return `<div class="bg-white border border-black p-1 rounded px-3 shadow-sm">
                            <span class="text-red-500 font-black">#${n}</span> = 
                            <span class="text-blue-600 text-lg">${inputVal}</span>
                        </div>`;
            }).join('');
        }

        function checkSolution() {
            const inputs = document.querySelectorAll('.input-letter');
            let correct = true;
            inputs.forEach(i => {
                if(i.value.toUpperCase() !== i.dataset.letter) {
                    correct = false;
                    i.classList.add('bg-red-100');
                } else {
                    i.classList.remove('bg-red-100');
                    i.classList.add('bg-green-100');
                }
            });

            const msg = document.getElementById('result-message');
            if(correct) {
                msg.innerText = "¡BOOM! CORRETTO! 🏆";
                msg.className = "mt-6 text-center text-5xl text-green-600 font-bold block animate-bounce comic-font";
                document.getElementById('btn-check').classList.add('hidden');
                document.getElementById('btn-next').classList.remove('hidden');
            } else {
                msg.innerText = "Sbagliato! Controlla i numeri in rosso...";
                msg.className = "mt-6 text-center text-2xl text-red-600 font-bold block comic-font";
            }
        }

        function nextLevel() {
            if(currentLevelIndex < levels.length - 1) {
                currentLevelIndex++;
                initLevel();
            } else {
                alert("CONGRATULAZIONI! Hai risolto tutti i criptogrammi!");
                currentLevelIndex = 0;
                initLevel();
            }
        }

        function resetLevel() {
            initLevel();
        }

        function printToPDF() {
            window.print();
        }

        function downloadAsHTML() {
            const content = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([content], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'criptogrammi_odontotecnica_3_4.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        window.onload = initLevel;
    </script>
</body>
</html>
