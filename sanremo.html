<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esplorazione Botanica a Sanremo: Dal Parco Marsaglia a Villa Zirio</title>
  <style>
    :root {
      --bg-main: #f4f7f2;
      --bg-card: #ffffff;
      --primary: #1b5e20;
      --primary-light: #e8f5e9;
      --primary-mid: #2e7d32;
      --accent: #0277bd;
      --accent-light: #e1f5fe;
      --warm: #ef6c00;
      --warm-light: #fff3e0;
      --gold: #f9a825;
      --text-dark: #1a241b;
      --text-muted: #4a5d4e;
      --border: #c8d6ca;
      --shadow: 0 6px 20px rgba(27, 94, 32, 0.09);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-dark);
      line-height: 1.6;
      font-size: 16px;
    }

    /* Header & Banner */
    header {
      background: linear-gradient(135deg, #144d19 0%, #1b5e20 55%, #01579b 100%);
      color: #ffffff;
      padding: 1.4rem 1.2rem;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .title-group h1 {
      font-size: clamp(1.35rem, 2.8vw, 1.95rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .title-group p {
      font-size: 0.95rem;
      opacity: 0.92;
      margin-top: 0.3rem;
    }

    .hud-panel {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(6px);
      padding: 0.65rem 1rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .hud-stat {
      text-align: center;
      padding: 0 0.4rem;
    }

    .hud-stat span.val {
      display: block;
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffe082;
    }

    .hud-stat span.lbl {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.9;
    }

    /* Main Container */
    main {
      max-width: 1120px;
      margin: 1.4rem auto 2.5rem;
      padding: 0 1rem;
    }

    /* Progress & Route Map Bar */
    .route-tracker {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 1.2rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
      font
