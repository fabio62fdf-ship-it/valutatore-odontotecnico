<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruota della Fortuna - Stati della Materia e Proprietà Superficiali</title>
    <style>
        :root {

            margin-bottom: 5px;

            gap: 20px;

            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);

            left: 50%;

            height: 0;

            border-right: 18px solid transparent;
            border-top: 35px solid #ef4444;

        }
        .panel {
            width: 400px;

            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);

            font-weight: bold;
            margin-bottom: 15px;

        }
        button.spin-btn {

        { id: 17, q: "In che cosa consiste il processo di SINTERIZZAZIONE usato in metallo-ceramica?", options: ["Nel riscaldamento di polveri ceramiche o metalliche a temperature inferiori alla fusione per saldarle tra loro", "Nella fusione completa della lega in centrifuga a induzione", "Nella trasformazione dell'alginato da sol a gel irreversibile", "Nella cristallizzazione rapida di un vetro inorganico"], correct: 0, explanation: "La sinterizzazione ricompatta le polveri riscaldandole al di sotto del loro punto di fusione, facendo aderire i granuli per diffusione atomica." },
        { id: 18, q: "Quali ossidi inorganici si aggiungono ai vetri per ottenere rispettivamente le colorazioni Verde-Azzurro e Rosso?", options: ["FeO (Verde-Azzurro) e Cu2O (Rosso)", "Fe2O3 (Verde-Azzurro) e Cr2O3 (Rosso)", "SiO2 (Verde-Azzurro) e FeO (Rosso)", "Al2O3 (Verde-Azzurro) e Cu2O (Rosso)"], correct: 0, explanation: "L'ossido ferroso (FeO) dona al vetro la colorazione verde-azzurro, mentre l'ossido rameoso (Cu2O) conferisce la colorazione rossa." },
        { id: 19, q: "Come varia la temperatura di un solido puro durante l'intero processo di fusione?", options: ["Resta costante fino a quando tutto il solido non è diventato liquido", "Aumenta in modo lineare man mano che si somministra calore", "Diminuisce a causa del riordino cristallino", "Oscilla in base alla presenza di dislocazioni"], correct: 0, explanation: "Durante il passaggio di stato di un elemento o sostanza pura, la temperatura rimane rigorosamente costante finché coesistono le due fasi." },
        { id: 20, q: "Che differenza fondamentale c'è tra una soluzione solida di SOSTITUZIONE e una INTERSTIZIALE?", options: ["Nella sostituzione atomi di soluto rimpiazzano atomi di solvente nei nodi; nell'interstiziale si posizionano negli spazi vuoti", "La soluzione di sostituzione si applica solo ai vetri amorfi", "Nelle soluzioni interstiziali gli atomi di soluto sono sempre più grandi del solvente", "Nessuna, sono entrambi colloidi reversibili"], correct: 0, explanation: "Nelle soluzioni solide di sostituzione i nodi del reticolo sono occupati da atomi diversi, mentre in quelle interstiziali atomi piccoli si inseriscono tra i vuoti del reticolo." }

];

const colors = [
    '#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#1abc9c', '#3498db',
    '#9b59b6', '#e84393', '#fdcb6e', '#00b894', '#0984e3', '#6c5ce7',
    '#fab1a0', '#55efc4', '#81ecec', '#74b9ff', '#a29bfe', '#ffeaa7',
    '#ff7675', '#fd79a8', '#00cec9', '#ffeaa7', '#fab1a0', '#e17055'
];

let startAngle = 0;
let outsideRadius = 190;
let textRadius = 135;
let ctxCenter = 210;

function drawWheel() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    for (let i = 0; i < numSectors; i++) {
        let angle = startAngle + i * arc;
        
        ctx.beginPath();
        ctx.moveTo(ctxCenter, ctxCenter);
        ctx.arc(ctxCenter, ctxCenter, outsideRadius, angle, angle + arc, false);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();

        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
        ctx.shadowBlur = 4;
        ctx.font = "bold 14px Arial";
        ctx.translate(
            ctxCenter + Math.cos(angle + arc / 2) * textRadius,
            ctxCenter + Math.sin(angle + arc / 2) * textRadius
        );
        ctx.rotate(angle + arc / 2 + Math.PI / 2);
        let text = sectorsData[i].score.toString();
        ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
        ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(ctxCenter, ctxCenter, 25, 0, 2 * Math.PI);
    ctx.fillStyle = "#ffd700";
    ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
    ctx.shadowBlur = 6;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#fff";
    ctx.stroke();
}

let spinAngleStart = 0;
let spinTime = 0;
let spinTimeTotal = 0;

function spinWheel() {
    document.getElementById('spinBtn').disabled = true;
    spinAngleStart = Math.random() * 30 + 40;
    spinTime = 0;
    spinTimeTotal = Math.random() * 1500 + 1500;
    rotateWheel();
}

function rotateWheel() {
    spinTime += 20;
    if (spinTime >= spinTimeTotal) {
        stopRotateWheel();
        return;
    }
    let spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
    startAngle += (spinAngle * Math.PI / 180);
    drawWheel();
    setTimeout(rotateWheel, 20);
}

function easeOut(t, b, c, d) {
    let ts = (t /= d) * t;
    let tc = ts * t;
    return b + c * (tc + -3 * ts + 3 * t);
}

function stopRotateWheel() {
    let degrees = startAngle * 180 / Math.PI + 90;
    let arcd = arc * 180 / Math.PI;
    let index = Math.floor((360 - (degrees % 360)) / arcd) % numSectors;
    
    currentScoreValue = sectorsData[index].score;
    
    document.getElementById('spinBtn').style.display = 'none';
    document.getElementById('questionBox').style.display = 'block';
    
    loadQuestion(currentScoreValue);
}

function loadQuestion(scoreVal) {
    if (scoreVal === 0) {
        document.getElementById('scoreBadge').innerText = "0 Punti (Pausa)";
        document.getElementById('questionText').innerText = "Turno di pausa! Nessuna domanda per questo giro.";
        const optionsContainer = document.getElementById('optionsContainer');
        optionsContainer.innerHTML = '';
        document.getElementById('feedback').innerText = "Il turno passa all'altra squadra.";
        document.getElementById('nextTurnBtn').style.display = 'block';
        currentActiveQuestion = null;
        return;
    }

    if (!availableQuestions[scoreVal] || availableQuestions[scoreVal].length === 0) {
        availableQuestions[scoreVal] = JSON.parse(JSON.stringify(masterQuestionsDB[scoreVal]));
    }

    document.getElementById('scoreBadge').innerText = `Punteggio in palio: ${scoreVal} punti`;
    
    const pool = availableQuestions[scoreVal];
    const randIdx = Math.floor(Math.random() * pool.length);
    const qObj = pool.splice(randIdx, 1)[0];
    currentActiveQuestion = qObj;

    document.getElementById('questionText').innerText = qObj.q;
    
    const optionsContainer = document.getElementById('optionsContainer');
    optionsContainer.innerHTML = '';
    document.getElementById('feedback').innerText = '';
    document.getElementById('nextTurnBtn').style.display = 'none';

    let opts = qObj.options.map((opt, idx) => ({ text: opt, isCorrect: idx === qObj.correct }));
    opts.sort(() => Math.random() - 0.5);

    opts.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = item.text;
        btn.onclick = () => checkAnswer(item.isCorrect, btn, opts);
        optionsContainer.appendChild(btn);
    });
}

function checkAnswer(isCorrect, selectedBtn, opts) {
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(b => b.disabled = true);

    const feedback = document.getElementById('feedback');

    if (isCorrect) {
        selectedBtn.classList.add('correct');
        feedback.style.color = '#22c55e';
        feedback.innerText = `CORRETTO! +${currentScoreValue} punti. ${currentActiveQuestion.explanation}`;
        scores[currentPlayer] += currentScoreValue;
        updateScoreboard();
        checkWinCondition();
    } else {
        selectedBtn.classList.add('incorrect');
        feedback.style.color = '#ef4444';
        feedback.innerText = `ERRATO! ${currentActiveQuestion.explanation}`;
        buttons.forEach((b, idx) => {
            if (opts[idx].isCorrect) b.classList.add('correct');
        });
    }

    document.getElementById('nextTurnBtn').style.display = 'block';
}

function updateScoreboard() {
    document.getElementById('p1Score').innerText = scores[1] + " pt";
    document.getElementById('p2Score').innerText = scores[2] + " pt";
}

function checkWinCondition() {
    if (scores[1] >= 1500 || scores[2] >= 1500) {
        document.getElementById('gameActiveArea').style.display = 'none';
        document.getElementById('wheelWrapper').style.display = 'none';
        const winner = scores[1] >= 1500 ? "SQUADRA 1" : "SQUADRA 2";
        document.getElementById('winnerText').innerText = `🎉 LA ${winner} HA VINTO LA PARTITA RAGGIUNGENDO 1500 PUNTI! 🎉`;
        document.getElementById('winnerScreen').style.display = 'block';
    }
}

function nextTurn() {
    if (scores[1] >= 1500 || scores[2] >= 1500) return;

    currentPlayer = currentPlayer === 1 ? 2 : 1;
    document.getElementById('p1Card').classList.toggle('active', currentPlayer === 1);
    document.getElementById('p2Card').classList.toggle('active', currentPlayer === 2);
    document.getElementById('turnInfo').innerText = `Tocca alla Squadra ${currentPlayer}`;

    document.getElementById('questionBox').style.display = 'none';
    document.getElementById('spinBtn').style.display = 'block';
    document.getElementById('spinBtn').disabled = false;
}

function resetGame() {
    scores = { 1: 0, 2: 0 };
    currentPlayer = 1;
    availableQuestions = JSON.parse(JSON.stringify(masterQuestionsDB));
    updateScoreboard();
    document.getElementById('p1Card').classList.add('active');
    document.getElementById('p2Card').classList.remove('active');
    document.getElementById('turnInfo').innerText = "Tocca alla Squadra 1";
    document.getElementById('winnerScreen').style.display = 'none';
    document.getElementById('gameActiveArea').style.display = 'block';
    document.getElementById('wheelWrapper').style.display = 'block';
    document.getElementById('questionBox').style.display = 'none';
    document.getElementById('spinBtn').style.display = 'block';
    document.getElementById('spinBtn').disabled = false;
    drawWheel();
}

function downloadApp() {
    const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    const blob = new Blob([htmlContent], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ruota_stati_materia_protesica.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

drawWheel();
</script>
