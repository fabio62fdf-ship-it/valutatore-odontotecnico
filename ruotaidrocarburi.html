<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruota della Fortuna - Chimica Organica (Modulo 4)</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel-bg: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
        h1 {
            margin-bottom: 5px;
            color: #38bdf8;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            text-align: center;
            font-size: 1.8rem;
        }
        p.subtitle {
            color: #94a3b8;
            margin-bottom: 15px;
            text-align: center;
            font-size: 0.95rem;
        }
        .scoreboard {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        .player-card {
            background: var(--panel-bg);
            padding: 10px 25px;
            border-radius: 12px;
            border: 2px solid #334155;
            text-align: center;
            min-width: 140px;
            transition: all 0.3s;
        }
        .player-card.active {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            transform: scale(1.05);
        }
        .player-card h3 {
            margin: 0 0 5px 0;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        .player-card .score {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffd700;
        }
        .main-container {
            display: flex;
            gap: 40px;
            align-items: center;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            flex-wrap: wrap;
            justify-content: center;
        }
        .wheel-container {
            position: relative;
            width: 420px;
            height: 420px;
        }
        canvas {
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
            background: #1e293b;
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 35px solid #ef4444;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.5));
            z-index: 10;
        }
        .panel {
            width: 400px;
            background: #0f172a;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #334155;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .turn-info {
            font-size: 1.1rem;
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }
        button.spin-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 15px;
        }
        button.spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .question-box {
            display: none;
            margin-top: 10px;
        }
        .question-text {
            font-size: 0.95rem;
            margin-bottom: 12px;
            line-height: 1.4;
            color: #f1f5f9;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .option-btn {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .option-btn:hover:not(:disabled) {
            background: #334155;
            border-color: #38bdf8;
        }
        .option-btn.correct {
            background: #166534 !important;
            border-color: #22c55e !important;
        }
        .option-btn.incorrect {
            background: #991b1b !important;
            border-color: #ef4444 !important;
        }
        .feedback {
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
            font-size: 0.9rem;
        }
        .next-turn-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            display: none;
        }
        .next-turn-btn:hover {
            background: var(--accent-hover);
        }
        .winner-screen {
            display: none;
            text-align: center;
        }
        .winner-screen h2 {
            color: #ffd700;
            font-size: 2rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <h1>Ruota della Fortuna - Chimica Organica (Modulo 4)</h1>
    <p class="subtitle">24 Settori • Punteggi da 0 a 500 • Traguardo vittoria: 1500 punti</p>

    <div class="scoreboard">
        <div id="p1Card" class="player-card active">
            <h3>SQUADRA 1</h3>
            <div id="p1Score" class="score">0 pt</div>
        </div>
        <div id="p2Card" class="player-card">
            <h3>SQUADRA 2</h3>
            <div id="p2Score" class="score">0 pt</div>
        </div>
    </div>

    <div class="main-container">
        <div class="wheel-container" id="wheelWrapper">
            <div class="pointer"></div>
            <canvas id="wheel" width="420" height="420"></canvas>
        </div>

        <div class="panel">
            <div id="gameActiveArea">
                <div id="turnInfo" class="turn-info">Tocca alla Squadra 1</div>
                <div id="actionArea">
                    <button id="spinBtn" class="spin-btn" onclick="spinWheel()">GIRA LA RUOTA</button>
                </div>
                
                <div id="questionBox" class="question-box">
                    <div id="scoreBadge" style="color: #ffd700; font-weight: bold; margin-bottom: 8px;"></div>
                    <div id="questionText" class="question-text"></div>
                    <div id="optionsContainer" class="options-container"></div>
                    <div id="feedback" class="feedback"></div>
                    <button id="nextTurnBtn" class="next-turn-btn" onclick="nextTurn()">PROSSIMO TURNO</button>
                </div>
            </div>

            <div id="winnerScreen" class="winner-screen">
                <h2 id="winnerText"></h2>
                <button class="spin-btn" onclick="resetGame()">GIOCA ANCORA</button>
            </div>
        </div>
    </div>

<script>
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const numSectors = 24;
const arc = (2 * Math.PI) / numSectors;

let currentPlayer = 1;
let scores = { 1: 0, 2: 0 };
let currentScoreValue = 0;
let currentActiveQuestion = null;

const masterQuestionsDB = {
    100: [
        { id: 1, q: "Quale evento storico e molecola segnano la nascita della chimica organica nel 1829?", options: ["La sintesi dell'urea da parte di F. Wöhler", "La scoperta del benzene da parte di Faraday", "La sintesi del polietilene", "La scoperta del metano"], correct: 0, explanation: "Nel 1829 F. Wöhler segna la nascita della chimica del carbonio con la sintesi dell'urea H2N-CO-NH2[cite: 33]." },
        { id: 2, q: "Qual è la formula generale degli alcani (idrocarburi saturi)?", options: ["CnH2n+2", "CnH2n", "CnH2n-2", "C6H6"], correct: 0, explanation: "Gli alcani hanno formula generica CnH2n+2, dove n è un numero intero diverso da 0[cite: 40]." },
        { id: 3, q: "Qual è il primo termine (capofila) della serie degli alcani?", options: ["Metano (CH4)", "Etano (C2H6)", "Propano (C3H8)", "Etilene (C2H4)"], correct: 0, explanation: "Il capofila degli alcani è il metano (CH4) con n=1[cite: 40]." },
        { id: 4, q: "Qual è la formula generale degli alcheni?", options: ["CnH2n", "CnH2n+2", "CnH2n-2", "C6H5R"], correct: 0, explanation: "Gli alcheni sono idrocarburi insaturi con formula bruta generica CnH2n[cite: 46]." },
        { id: 5, q: "Qual è il primo termine della serie degli alchini?", options: ["Acetilene (Etino)", "Etilene", "Metano", "Benzene"], correct: 0, explanation: "Il primo termine degli alchini caratterizzati da triplo legame è l'acetilene[cite: 46]." }
    ],
    200: [
        { id: 6, q: "Che tipo di ibridazione adotta il carbonio impegnato in legami covalenti semplici?", options: ["sp3", "sp2", "sp", "Non ibridato p"], correct: 0, explanation: "Il carbonio con legami semplici utilizza l'ibridazione sp3 con geometria tetraedrica[cite: 36]." },
        { id: 7, q: "Qual è la geometria molecolare associata all'ibridazione sp2 del carbonio (es. nell'etilene)?", options: ["Trigonale", "Tetraedrica", "Lineare", "Ottaedrica"], correct: 0, explanation: "Gli orbitali sp2 formano angoli di 120° con geometria trigonale[cite: 35, 36]." },
        { id: 8, q: "Come si definiscono i composti che possiedono lo stesso numero di atomi ma diversa disposizione strutturale?", options: ["Isomeri", "Isotopi", "Allotropi", "Polimeri"], correct: 0, explanation: "Gli isomeri possiedono lo stesso numero di atomi dello stesso tipo ma differiscono per il modo in cui sono legati[cite: 41]." },
        { id: 9, q: "Quali sono i prodotti principali della combustione degli alcani?", options: ["Anidride carbonica e acqua", "Carbonio elementare e idrogeno", "Acidi organici e alcoli", "Cloroformio e acido cloridrico"], correct: 0, explanation: "La combustione degli idrocarburi porta alla formazione di acqua più anidride carbonica[cite: 45]." },
        { id: 10, q: "Come si chiama il radicale derivato dall'etene (etilene) con formula CH2=CH-?", options: ["Vinile", "Allile", "Metile", "Propile"], correct: 0, explanation: "Il radicale CH2=CH- è denominato vinile[cite: 48]." }
    ],
    300: [
        { id: 11, q: "Qual è l'andamento dell'elettronegatività in base all'ibridazione del carbonio?", options: ["sp > sp2 > sp3", "sp3 > sp2 > sp", "sp2 > sp > sp3", "È sempre costante"], correct: 0, explanation: "L'andamento dell'elettronegatività degli ibridi del carbonio è sp > sp2 > sp3[cite: 35]." },
        { id: 12, q: "Come si forma un legame chimico di tipo pi greco (π)?", options: ["Mediante sovrapposizione laterale di orbitali atomici", "Mediante sovrapposizione testa contro testa", "Per trasferimento completo di elettroni", "Tramite interazioni elettrostatiche pure"], correct: 0, explanation: "La sovrapposizione laterale degli orbitali definisce il legame pi greco, che è più debole del sigma[cite: 37]." },
        { id: 13, q: "Quali conformazioni può assumere la molecola dell'etano per rotazione attorno al legame semplice?", options: ["Sfalsata ed eclissata", "A sedia e a barca", "Cis e trans", "Ortocomtto e para"], correct: 0, explanation: "L'etano ha due conformazioni principali: sfalsata (più stabile) ed eclissata (meno stabile)[cite: 42]." },
        { id: 14, q: "Quale tipo di reazione caratterizza tipicamente gli alcheni grazie alla presenza del legame pi greco?", options: ["Addizione elettrofila", "Sostituzione radicalica", "Eliminazione termica", "Idrolisi alcalina"], correct: 0, explanation: "Il legame pi greco degli alcheni è facilmente attaccabile dagli elettrofili, dando luogo ad addizione elettrofila[cite: 49]." },
        { id: 15, q: "Qual è il termine più semplice dei dieni coniugati, importante per la sintesi di gomme sintetiche?", options: ["1,3-butadiene", "Isoprene", "Acetilene", "Stirene"], correct: 0, explanation: "Il (1,3) butadiene è il diene coniugato più semplice, impiegato per gomme sintetiche e resine ABS[cite: 54]." }
    ],
    400: [
        { id: 16, q: "Cosa spiega la teoria dell'ibridazione sp3 nel carbonio (numero atomico 6)?", options: ["La sua tetravalenza costante e l'equivalenza dei 4 legami nel metano", "Il passaggio diretto dallo stato solido a gassoso", "La formazione di doppi legami planari", "La risonanza ciclica del benzene"], correct: 0, explanation: "L'ibridazione mescola le funzioni d'onda di un orbitale 2s e tre 2p formando quattro orbitali sp3 equivalenti, spiegando la tetravalenza[cite: 34]." },
        { id: 17, q: "Cosa descrive l'isomeria geometrica cis-trans negli alcheni?", options: ["La rigidità del doppio legame che impedisce la libera rotazione, posizionando i sostituenti dallo stesso lato o opposti", "La diversa conformazione spaziale a sedia o barca del cicloesano", "La presenza di radicali liberi alogenati", "L'inversione ottica speculare molecolare"], correct: 0, explanation: "La rigidità del doppio legame genera l'isomeria cis (gruppi simili dalla stessa parte) e trans (parti opposte)[cite: 48]." },
        { id: 18, q: "Quali sono le quattro fasi della polimerizzazione radicalica (fondamentale in campo dentale)?", options: ["Induzione, propagazione, terminazione", "Fusione, colata, tempra, ricottura", "Nucleazione, accrescimento, devetrificazione, raffreddamento", "Innesco, transizione, equilibrio, stasi"], correct: 0, explanation: "La polimerizzazione radicalica si divide nelle fasi di induzione, propagazione e terminazione[cite: 51, 52]." },
        { id: 19, q: "Come viene rappresentato storicamente il benzene (C6H6) per spiegarne la delocalizzazione dei legami pi greco?", options: ["Tramite le due forme di risonanza di Kekulé e la doppia ciambella di elettroni", "Come un anello saturo di tipo ciclesano", "Con tre doppi legami rigidi fissi alternati", "Attraverso legami ionici di coordinazione"], correct: 0, explanation: "Il benzene è rappresentato dalle due forme di Kekulé (risonanza) con elettroni delocalizzati in una doppia ciambella sopra e sotto l'esagono[cite: 55]." },
        { id: 20, q: "Cosa indicano i termini orto, meta e para nella nomenclatura dei derivati benzenici disostituiti (es. xileni)?", options: ["Le posizioni relative dei sostituenti sull'anello aromatico rispettivamente in 1,2; 1,3 e 1,4", "I tre tipi di ibridazione sp, sp2 e sp3 del benzene", "Le fasi di distillazione frazionata del petrolio", "I gradi di insaturazione della catena alifatica"], correct: 0, explanation: "Nei derivati benzenici con due metili, 1,2 è orto-xilene, 1,3 è meta-xilene e 1,4 è para-xilene[cite: 56]." }
    ],
    500: [
        { id: 21, q: "Qual è l'ordine crescente corretto dell'energia degli orbitali atomici e ibridi del carbonio?", options: ["2s < 2sp < 2sp2 < 2sp3 < 2p", "2p < 2sp3 < 2sp2 < 2sp < 2s", "2sp3 < 2sp2 < 2sp < 2s < 2p", "2s < 2p < 2sp < 2sp2 < 2sp3"], correct: 0, explanation: "L'andamento energetico crescente degli orbitali è 2s < 2sp < 2sp2 < 2sp3 < 2p[cite: 35]." },
        { id: 22, q: "Cosa avviene durante la reazione di alogenazione degli alcani (es. con cloro o bromo in presenza di luce)?", options: ["La formazione di radicali liberi di alogeno altamente reattivi che sostituiscono gli idrogeni", "Un'addizione elettrofila istantanea al doppio legame", "Una polimerizzazione radicalica a catena lunga", "Una combustione incompleta con residuo di carbonio"], correct: 0, explanation: "L'alogenazione in presenza di luce produce radicali liberi (es. Cl·) che portano a derivati alogenati come cloroformio o tetracloruro[cite: 45]." },
        { id: 23, q: "Quali sono le principali modalità di attivazione delle polimerizzazioni radicaliche in odontotecnica?", options: ["Termica, chimica (autoattivabili), fotoattivabile e per microonde", "Ionica, covalente, metallica e idrocolloidale", "Meccanica, pneumatica, idraulica e ultrasonica", "Solo per fusione a induzione e compressione"], correct: 0, explanation: "Le resine dentali sfruttano l'attivazione termica, chimica, fotochimica (luce visibile) o per microonde[cite: 53]." },
        { id: 24, q: "Quale processo di raffineria converte frazioni petrolifere pesanti in molecole più piccole di benzina ad alto numero di ottano?", options: ["Cracking catalitico e Reforming catalitico", "Distillazione frazionata a pressione atmosferica", "Solfonazione e nitrazione aromatica", "Idrogenazione radicalica dei dieni"], correct: 0, explanation: "Il cracking frantuma molecole grandi in benzine, mentre il reforming converte idrocarburi in aromatici e cicloalcani ad alto numero di ottano[cite: 59]." }
    ]
};

let availableQuestions = JSON.parse(JSON.stringify(masterQuestionsDB));

const sectorsData = [
    { score: 0 }, { score: 100 }, { score: 200 }, { score: 300 }, { score: 400 }, { score: 500 },
    { score: 0 }, { score: 100 }, { score: 200 }, { score: 300 }, { score: 400 }, { score: 500 },
    { score: 0 }, { score: 100 }, { score: 200 }, { score: 300 }, { score: 400 }, { score: 500 },
    { score: 0 }, { score: 100 }, { score: 200 }, { score: 300 }, { score: 400 }, { score: 500 }
];

const colors = [
    '#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#1abc9c', '#3498db',
    '#9b59b6', '#e84393', '#fdcb6e', '#00b894', '#0984e3', '#6c5ce7',
    '#fab1a0', '#55efc4', '#81ecec', '#74b9ff', '#a29bfe', '#ffeaa7',
    '#ff7675', '#fd79a8', '#00cec9', '#ffeaa7', '#fab1a0', '#e17055'
];

let startAngle = 0;
let outsideRadius = 190;
let textRadius = 135;
let ctxCenter = 210;

function drawWheel() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    for (let i = 0; i < numSectors; i++) {
        let angle = startAngle + i * arc;
        
        ctx.beginPath();
        ctx.moveTo(ctxCenter, ctxCenter);
        ctx.arc(ctxCenter, ctxCenter, outsideRadius, angle, angle + arc, false);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();

        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
        ctx.shadowBlur = 4;
        ctx.font = "bold 14px Arial";
        ctx.translate(
            ctxCenter + Math.cos(angle + arc / 2) * textRadius,
            ctxCenter + Math.sin(angle + arc / 2) * textRadius
        );
        ctx.rotate(angle + arc / 2 + Math.PI / 2);
        let text = sectorsData[i].score.toString();
        ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
        ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(ctxCenter, ctxCenter, 25, 0, 2 * Math.PI);
    ctx.fillStyle = "#ffd700";
    ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
    ctx.shadowBlur = 6;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#fff";
    ctx.stroke();
}

let spinAngleStart = 0;
let spinTime = 0;
let spinTimeTotal = 0;

function spinWheel() {
    document.getElementById('spinBtn').disabled = true;
    // Rotazione più rapida e fluida richiesta
    spinAngleStart = Math.random() * 30 + 40;
    spinTime = 0;
    spinTimeTotal = Math.random() * 1500 + 1500; // Durata ridotta per velocità rapida
    rotateWheel();
}

function rotateWheel() {
    spinTime += 20;
    if (spinTime >= spinTimeTotal) {
        stopRotateWheel();
        return;
    }
    let spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
    startAngle += (spinAngle * Math.PI / 180);
    drawWheel();
    setTimeout(rotateWheel, 20);
}

function easeOut(t, b, c, d) {
    let ts = (t /= d) * t;
    let tc = ts * t;
    return b + c * (tc + -3 * ts + 3 * t);
}

function stopRotateWheel() {
    let degrees = startAngle * 180 / Math.PI + 90;
    let arcd = arc * 180 / Math.PI;
    let index = Math.floor((360 - (degrees % 360)) / arcd) % numSectors;
    
    currentScoreValue = sectorsData[index].score;
    
    document.getElementById('spinBtn').style.display = 'none';
    document.getElementById('questionBox').style.display = 'block';
    
    loadQuestion(currentScoreValue);
}

function loadQuestion(scoreVal) {
    if (scoreVal === 0) {
        document.getElementById('scoreBadge').innerText = "0 Punti (Pausa)";
        document.getElementById('questionText').innerText = "Turno di pausa! Nessuna domanda per questo giro.";
        const optionsContainer = document.getElementById('optionsContainer');
        optionsContainer.innerHTML = '';
        document.getElementById('feedback').innerText = "Il turno passa all'altra squadra.";
        document.getElementById('nextTurnBtn').style.display = 'block';
        currentActiveQuestion = null;
        return;
    }

    if (!availableQuestions[scoreVal] || availableQuestions[scoreVal].length === 0) {
        availableQuestions[scoreVal] = JSON.parse(JSON.stringify(masterQuestionsDB[scoreVal]));
    }

    document.getElementById('scoreBadge').innerText = `Punteggio in palio: ${scoreVal} punti`;
    
    const pool = availableQuestions[scoreVal];
    const randIdx = Math.floor(Math.random() * pool.length);
    const qObj = pool.splice(randIdx, 1)[0];
    currentActiveQuestion = qObj;

    document.getElementById('questionText').innerText = qObj.q;
    
    const optionsContainer = document.getElementById('optionsContainer');
    optionsContainer.innerHTML = '';
    document.getElementById('feedback').innerText = '';
    document.getElementById('nextTurnBtn').style.display = 'none';

    let opts = qObj.options.map((opt, idx) => ({ text: opt, isCorrect: idx === qObj.correct }));
    opts.sort(() => Math.random() - 0.5);

    opts.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = item.text;
        btn.onclick = () => checkAnswer(item.isCorrect, btn, opts);
        optionsContainer.appendChild(btn);
    });
}

function checkAnswer(isCorrect, selectedBtn, opts) {
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(b => b.disabled = true);

    const feedback = document.getElementById('feedback');

    if (isCorrect) {
        selectedBtn.classList.add('correct');
        feedback.style.color = '#22c55e';
        feedback.innerText = `CORRETTO! +${currentScoreValue} punti. ${currentActiveQuestion.explanation}`;
        scores[currentPlayer] += currentScoreValue;
        updateScoreboard();
        checkWinCondition();
    } else {
        selectedBtn.classList.add('incorrect');
        feedback.style.color = '#ef4444';
        feedback.innerText = `ERRATO! ${currentActiveQuestion.explanation}`;
        buttons.forEach((b, idx) => {
            if (opts[idx].isCorrect) b.classList.add('correct');
        });
    }

    document.getElementById('nextTurnBtn').style.display = 'block';
}

function updateScoreboard() {
    document.getElementById('p1Score').innerText = scores[1] + " pt";
    document.getElementById('p2Score').innerText = scores[2] + " pt";
}

function checkWinCondition() {
    if (scores[1] >= 1500 || scores[2] >= 1500) {
        document.getElementById('gameActiveArea').style.display = 'none';
        document.getElementById('wheelWrapper').style.display = 'none';
        const winner = scores[1] >= 1500 ? "SQUADRA 1" : "SQUADRA 2";
        document.getElementById('winnerText').innerText = `🎉 LA ${winner} HA VINTO LA PARTITA RAGGIUNGENDO 1500 PUNTI! 🎉`;
        document.getElementById('winnerScreen').style.display = 'block';
    }
}

function nextTurn() {
    if (scores[1] >= 1500 || scores[2] >= 1500) return;

    currentPlayer = currentPlayer === 1 ? 2 : 1;
    document.getElementById('p1Card').classList.toggle('active', currentPlayer === 1);
    document.getElementById('p2Card').classList.toggle('active', currentPlayer === 2);
    document.getElementById('turnInfo').innerText = `Tocca alla Squadra ${currentPlayer}`;

    document.getElementById('questionBox').style.display = 'none';
    document.getElementById('spinBtn').style.display = 'block';
    document.getElementById('spinBtn').disabled = false;
}

function resetGame() {
    scores = { 1: 0, 2: 0 };
    currentPlayer = 1;
    availableQuestions = JSON.parse(JSON.stringify(masterQuestionsDB));
    updateScoreboard();
    document.getElementById('p1Card').classList.add('active');
    document.getElementById('p2Card').classList.remove('active');
    document.getElementById('turnInfo').innerText = "Tocca alla Squadra 1";
    document.getElementById('winnerScreen').style.display = 'none';
    document.getElementById('gameActiveArea').style.display = 'block';
    document.getElementById('wheelWrapper').style.display = 'block';
    document.getElementById('questionBox').style.display = 'none';
    document.getElementById('spinBtn').style.display = 'block';
    document.getElementById('spinBtn').disabled = false;
    drawWheel();
}

drawWheel();
</script>

</body>
</html>
